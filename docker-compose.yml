      start_period: '30s'
    depends_on:
      auction-migrate:
        condition: 'service_completed_successfully'
      rabbitmq:
        condition: 'service_healthy'
      redis:
        condition: 'service_healthy'
    ports:
      - '${AUCTION_PORT:-3003}:3003'
  order-migrate:
    build:
      context: '.'
      target: 'migration'
      args:
        SERVICE_NAME: 'order'
    environment:
      ORDER_DATABASE_URL: 'postgresql://${ORDER_DB_USER}:${ORDER_DB_PASSWORD}@postgres:5432/order_db'
    depends_on:
