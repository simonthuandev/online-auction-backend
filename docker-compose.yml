        condition: 'service_completed_successfully'
      rabbitmq:
        condition: 'service_healthy'
      redis:
        condition: 'service_healthy'
    ports:
      - '${NOTIFICATION_PORT:-3006}:3006'
volumes:
  postgres-data: {}
  rabbitmq-data: {}
  gateway-config: {}
networks:
  default:
    driver: 'bridge'
