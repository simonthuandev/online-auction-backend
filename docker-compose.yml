    depends_on:
      db-bootstrap:
        condition: 'service_completed_successfully'
  payment-service:
    build:
      context: '.'
      target: 'runtime'
      args:
        SERVICE_NAME: 'payment'
    init: true
    restart: 'unless-stopped'
    environment:
      JWT_ISSUER: '${JWT_ISSUER}'
      JWT_AUDIENCE: '${JWT_AUDIENCE}'
      JWT_KEY_ID: '${JWT_KEY_ID}'
      PLATFORM_ADMIN_KEY: '${PLATFORM_ADMIN_KEY}'
      CORS_ORIGINS: '${CORS_ORIGINS}'
      JWT_PUBLIC_KEY_PATH: '/run/keys/public.pem'
      RABBITMQ_URL: 'amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672'
      REDIS_URL: 'redis://:${REDIS_PASSWORD}@redis:6379'
      PLATFORM_DEMO_ENABLED: 'false'
      PAYMENT_DATABASE_URL: 'postgresql://${PAYMENT_DB_USER}:${PAYMENT_DB_PASSWORD}@postgres:5432/payment_db'
      PAYMENT_PORT: '3005'
      NODE_ENV: 'production'
      INTERNAL_PAYMENT_KEY: '${INTERNAL_PAYMENT_KEY}'
      ORDER_SERVICE_URL: 'http://order-service:3004'
    volumes:
      - './.local/keys/public.pem:/run/keys/public.pem:ro'
    stop_grace_period: '15s'
