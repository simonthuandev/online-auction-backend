services:
  postgres:
    image: postgres:15-alpine
    container_name: online-auction-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-root_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    networks:
      - auction-network

  redis:
    image: redis:7-alpine
    container_name: online-auction-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    networks:
      - auction-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: online-auction-rabbitmq
    restart: unless-stopped
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    networks:
      - auction-network

  krakend:
    image: devopsfaith/krakend:2.6.0
    container_name: online-auction-gateway
    restart: unless-stopped
    ports:
      - '${API_GATEWAY_PORT:-8080}:8080'
    volumes:
      - ./krakend:/etc/krakend
    command: run -d -c /etc/krakend/krakend.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - auction-network

volumes:
  postgres-data:

networks:
  auction-network:
    driver: bridge
