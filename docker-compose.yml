    depends_on:
      db-bootstrap:
        condition: 'service_completed_successfully'
  notification-service:
    build:
      context: '.'
      target: 'runtime'
      args:
        SERVICE_NAME: 'notification'
    init: true
    restart: 'unless-stopped'
    environment:
      JWT_ISSUER: '${JWT_ISSUER}'
      JWT_AUDIENCE: '${JWT_AUDIENCE}'
      JWT_KEY_ID: '${JWT_KEY_ID}'
      PLATFORM_ADMIN_KEY: '${PLATFORM_ADMIN_KEY}'
      CORS_ORIGINS: '${CORS_ORIGINS}'
      JWT_PUBLIC_KEY_PATH: '/run/keys/public.pem'
      RABBITMQ_URL: 'amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672'
      REDIS_URL: 'redis://:${REDIS_PASSWORD}@redis:6379'
      PLATFORM_DEMO_ENABLED: 'false'
      NOTIFICATION_DATABASE_URL: 'postgresql://${NOTIFICATION_DB_USER}:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification_db'
      NOTIFICATION_PORT: '3006'
      NODE_ENV: 'production'
    volumes:
      - './.local/keys/public.pem:/run/keys/public.pem:ro'
    stop_grace_period: '15s'
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - "fetch('http://localhost:3006/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
