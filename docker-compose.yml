      JWT_AUDIENCE: '${JWT_AUDIENCE}'
      JWT_KEY_ID: '${JWT_KEY_ID}'
      PLATFORM_ADMIN_KEY: '${PLATFORM_ADMIN_KEY}'
      CORS_ORIGINS: '${CORS_ORIGINS}'
      JWT_PUBLIC_KEY_PATH: '/run/keys/public.pem'
      RABBITMQ_URL: 'amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672'
      REDIS_URL: 'redis://:${REDIS_PASSWORD}@redis:6379'
      PLATFORM_DEMO_ENABLED: 'false'
      ORDER_DATABASE_URL: 'postgresql://${ORDER_DB_USER}:${ORDER_DB_PASSWORD}@postgres:5432/order_db'
      ORDER_PORT: '3004'
      NODE_ENV: 'production'
      INTERNAL_PAYMENT_KEY: '${INTERNAL_PAYMENT_KEY}'
    volumes:
      - './.local/keys/public.pem:/run/keys/public.pem:ro'
    stop_grace_period: '15s'
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - "fetch('http://localhost:3004/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
